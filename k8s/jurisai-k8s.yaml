# =============================================================================
# JurisAI - Kubernetes deployment (Rit Services cluster)
#   Ingress: Traefik IngressRoute   TLS: cert-manager (letsencrypt-prod)
#   Storage: Longhorn PVCs          Registry: GHCR (ghcr.io/rit-services/*, private)
#   Host:    compliance.rit.services
#
# Prerequisites created OUT OF BAND (not in this file, see k8s/README.md):
#   - Secret `jurisai-app-secrets` (DB creds, JWT, SMTP, ...) -> jurisai-app-secrets.yaml.example
#     (kept OUT of this synced manifest so ArgoCD never overwrites real credentials)
#   - Secret `ghcr-secret`      (private image pulls)       -> from a GitHub PAT (read:packages)
#   - DNS A record compliance.rit.services -> 172.236.204.215
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: jurisai
---
# ------------------- Encrypted storage (data-at-rest / GDPR) ------------------
# LUKS-encrypted Longhorn volumes. The passphrase lives in the `longhorn-crypto`
# Secret in namespace longhorn-system (create OUT OF BAND -> longhorn-crypto-secret.yaml.example).
# Node prereq: cryptsetup + dm_crypt available on the Longhorn nodes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-encrypted
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  encrypted: "true"
  # Global secret holding the LUKS key (referenced at provision + node stage/publish).
  csi.storage.k8s.io/provisioner-secret-name: longhorn-crypto
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-publish-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-stage-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system
---
# ---------------------------- PostgreSQL -------------------------------------
# NOTE: these claims are named *-enc-pvc because they replaced the original
# jurisai-postgres-pvc / jurisai-uploads-pvc, which were provisioned on the
# plain `longhorn` class before `longhorn-encrypted` existed. storageClassName
# is immutable, so the only way onto the encrypted class was a new claim. The
# old PVs were set to reclaimPolicy: Retain and can be deleted once this has
# been verified in production.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jurisai-postgres-enc-pvc
  namespace: jurisai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jurisai-postgres
  namespace: jurisai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jurisai-postgres
  template:
    metadata:
      labels:
        app: jurisai-postgres
    spec:
      # Runs directly as the image's `postgres` user (uid 70), which already owns
      # the data directory, so the entrypoint never needs root. No fsGroup on
      # purpose: it would make PGDATA group-writable and Postgres refuses to start
      # unless the data directory is 0700/0750.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16.15-alpine3.24
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: jurisai-app-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: jurisai-app-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: jurisai-app-secrets, key: POSTGRES_DB } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Writable scratch for the read-only root: the socket dir and temp files.
            - { name: pg-run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: jurisai-postgres-enc-pvc
        - { name: pg-run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: jurisai-postgres
  namespace: jurisai
spec:
  selector:
    app: jurisai-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# ------------------------------ API server -----------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jurisai-uploads-enc-pvc
  namespace: jurisai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jurisai-server
  namespace: jurisai
spec:
  # 0: the app moved to cluster 2 (compliance.k8s.rit.services, database on
  # prod-ha-1) on 2026-10-20. This database is the pre-move copy; keep it until
  # the move is confirmed, then retire cluster 1's jurisai resources.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jurisai-server
  template:
    metadata:
      labels:
        app: jurisai-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      # Non-root (the image's `node` user). fsGroup makes the uploads volume
      # writable for it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Wait until Postgres is accepting connections (its Service only has an
        # endpoint once the pod is Ready), so the server doesn't crash-loop.
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z jurisai-postgres 5432; do echo 'waiting for postgres'; sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      containers:
        - name: server
          image: ghcr.io/rit-services/jurisai-server:sha-c85fb5d1
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 4000
          env:
            # Plain, non-secret config lives in git for ArgoCD to manage. These
            # explicit env entries override the same keys from the
            # jurisai-app-secrets Secret pulled via envFrom below. (The Spirex
            # API KEY is a credential and stays in the Secret — see below.)
            - name: CLIENT_URL # public app URL used in verification/reset emails
              value: https://compliance.rit.services
            - name: FEEDBACK_RECIPIENTS
              value: shahnehal.a@rit.services
            - name: SPIREX_ORG_ID # RIT Services org
              value: cmpwl383l0001ak5y1kc0rxmt
            - name: SPIREX_PROJECT_ID # "Compliance Check" project (EL)
              value: cmqjaz9si012s13blgllmzcsp
          envFrom:
            - secretRef:
                name: jurisai-app-secrets
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            # Writable scratch for the read-only root: npm/npx caches and temp files.
            - { name: tmp, mountPath: /tmp }
            - { name: home, mountPath: /home/node }
          readinessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: jurisai-uploads-enc-pvc
        - { name: tmp, emptyDir: {} }
        - { name: home, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: jurisai-server
  namespace: jurisai
spec:
  selector:
    app: jurisai-server
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP
---
# ------------------------------ Web client -----------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jurisai-client
  namespace: jurisai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jurisai-client
  template:
    metadata:
      labels:
        app: jurisai-client
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      securityContext:
        seccompProfile: { type: RuntimeDefault }
        # Lets the non-root nginx keep listening on port 80 (namespaced, safe sysctl).
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "80" }
      containers:
        - name: client
          image: ghcr.io/rit-services/jurisai-client:sha-c85fb5d1
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          # The only writable paths. /tmp is what nginx-unprivileged uses;
          # /var/cache/nginx and /var/run keep the stock-nginx image working too.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - { name: nginx-run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: jurisai-client
  namespace: jurisai
spec:
  selector:
    app: jurisai-client
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jurisai-client-hpa
  namespace: jurisai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jurisai-client
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# ------------------------------ TLS certificate ------------------------------
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jurisai-cert
  namespace: jurisai
spec:
  secretName: jurisai-tls
  dnsNames:
    - compliance.rit.services
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
  privateKey:
    rotationPolicy: Always
---
# ------------------------------ Ingress (Traefik) ----------------------------
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jurisai-ingressroute
  namespace: jurisai
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # The app now runs on cluster 2. Send every request for the old address to
    # the new one (temporary redirect: we return to this name once HAProxy
    # routes compliance.rit.services to cluster 2).
    - match: Host(`compliance.rit.services`)
      kind: Rule
      middlewares:
        - name: jurisai-moved
      services:
        - name: jurisai-client
          port: 80
  tls:
    secretName: jurisai-tls
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jurisai-moved
  namespace: jurisai
spec:
  redirectRegex:
    regex: ^https?://compliance\.rit\.services/(.*)
    replacement: https://compliance.k8s.rit.services/${1}
    permanent: false
