# =============================================================================
# JurisAI on cluster 1 (rit-k3s-prod): retired.
# The app moved to cluster 2 on 2026-10-20 (k8s/cluster2/jurisai.yaml) and is
# served from there at compliance.rit.services. Its database, server, client,
# certificate and routes here were removed on 2026-11-23. What stays is the data:
# the encrypted volumes below and jurisai-backup-pvc (jurisai-backup.yaml), kept
# as the final copy of the pre-move data until they are deleted on purpose. The
# Namespace and the StorageClass stay because the volumes need them, and
# longhorn-encrypted is also used by other apps on this cluster.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: jurisai
---
# ------------------- Encrypted storage (data-at-rest / GDPR) ------------------
# LUKS-encrypted Longhorn volumes. The passphrase lives in the `longhorn-crypto`
# Secret in namespace longhorn-system (create OUT OF BAND -> longhorn-crypto-secret.yaml.example).
# Node prereq: cryptsetup + dm_crypt available on the Longhorn nodes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-encrypted
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  encrypted: "true"
  # Global secret holding the LUKS key (referenced at provision + node stage/publish).
  csi.storage.k8s.io/provisioner-secret-name: longhorn-crypto
  csi.storage.k8s.io/provisioner-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-publish-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-publish-secret-namespace: longhorn-system
  csi.storage.k8s.io/node-stage-secret-name: longhorn-crypto
  csi.storage.k8s.io/node-stage-secret-namespace: longhorn-system
---
# ---------------------------- PostgreSQL -------------------------------------
# The database itself was removed on 2026-11-23: nothing had used it since the
# move to cluster 2 on 2026-10-20 (server at 0, no connections), and its image
# carried known vulnerabilities. This volume stays, with the dumps on
# jurisai-backup-pvc, as the final copy of the pre-move data until both are
# deleted on purpose.
#
# NOTE: these claims are named *-enc-pvc because they replaced the original
# jurisai-postgres-pvc / jurisai-uploads-pvc, which were provisioned on the
# plain `longhorn` class before `longhorn-encrypted` existed. storageClassName
# is immutable, so the only way onto the encrypted class was a new claim. The
# old PVs were set to reclaimPolicy: Retain and can be deleted once this has
# been verified in production.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jurisai-postgres-enc-pvc
  namespace: jurisai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 5Gi
---
# ------------------------------ Uploads volume -------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jurisai-uploads-enc-pvc
  namespace: jurisai
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-encrypted
  resources:
    requests:
      storage: 2Gi
