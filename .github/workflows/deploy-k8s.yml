name: Build and Push JurisAI Images

# GitOps deploy: pushing to k8s-deployment builds + pushes images to GitHub
# Container Registry (ghcr.io, private), bumps the image tags in
# k8s/jurisai-k8s.yaml, and pings ArgoCD to sync.
# Auth uses the built-in GITHUB_TOKEN (no extra secret needed to push).
# workflow_dispatch lets the monthly law watch (law-watch.yml) start a deploy
# after it pushes content, since its GITHUB_TOKEN push triggers no workflow.
on:
  push:
    branches: [k8s-deployment]
  pull_request:
    branches: [k8s-deployment]
    types: [closed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Org namespace: since the repo moved to Rit-Services, the built-in
  # GITHUB_TOKEN can only publish packages under the org, not a personal account.
  IMAGE_OWNER: rit-services

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=sha-${GITHUB_SHA::8}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "GIT_COMMIT=${GITHUB_SHA}" >> $GITHUB_OUTPUT

      # Server image (context = repo ROOT so the server can include ../content).
      - name: Build and push Server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-server:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-server:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Client image (context = repo ROOT so the Vite alias to ../plugins resolves).
      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./client/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-client:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-client:${{ steps.meta.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Update deployment manifest with new image tags
        if: github.ref == 'refs/heads/k8s-deployment' && github.event_name != 'pull_request'
        run: |
          for f in k8s/jurisai-k8s.yaml k8s/cluster2/jurisai.yaml; do
            sed -i "s|image: ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-server:.*|image: ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-server:${{ steps.meta.outputs.VERSION }}|g" "$f"
            sed -i "s|image: ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-client:.*|image: ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-client:${{ steps.meta.outputs.VERSION }}|g" "$f"
          done
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add k8s/jurisai-k8s.yaml k8s/cluster2/jurisai.yaml
          git diff --staged --quiet || git commit -m "Update JurisAI image tags to ${{ steps.meta.outputs.VERSION }}"
          git push

      - name: Trigger ArgoCD Webhook
        if: |
          (github.ref == 'refs/heads/k8s-deployment' && github.event_name != 'pull_request') ||
          (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'k8s-deployment')
        run: |
          curl -X POST https://argocd.rit.services/api/webhook \
            -H "Content-Type: application/json" \
            -d '{
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}",
              "commit": "${{ github.sha }}",
              "version": "${{ steps.meta.outputs.VERSION }}",
              "server_image": "ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-server:${{ steps.meta.outputs.VERSION }}",
              "client_image": "ghcr.io/${{ env.IMAGE_OWNER }}/jurisai-client:${{ steps.meta.outputs.VERSION }}",
              "actor": "${{ github.actor }}"
            }'
