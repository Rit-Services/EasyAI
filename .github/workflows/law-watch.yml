name: Monthly law watch

# Checks every law in the catalog with RIT's Claude proxy, applies the changes a
# second check confirms to content/*.json, pushes them to k8s-deployment and
# starts the deploy workflow (see server/scripts/lawWatch.js). Uses the built-in
# GITHUB_TOKEN to push, so no personal token can expire.
#
# GitHub runs scheduled workflows only from the default branch (main), so this
# file must also exist there; the run itself always works on k8s-deployment.
# Repository secrets: CLAUDE_PROXY_TOKEN (required), RESEND_API_KEY (optional,
# for the summary email; the summary is always on the run page too).
on:
  schedule:
    - cron: '0 3 1 * *' # 1st of each month, 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check and report only, change nothing'
        type: boolean
        default: false
      only:
        description: 'Only these law keys, comma-separated (e.g. ki_mig,machinery). Empty = all'
        type: string
        default: ''

permissions:
  contents: write # push the content commit
  actions: write # start the deploy workflow

concurrency:
  group: law-watch
  cancel-in-progress: false

jobs:
  law-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout k8s-deployment
        uses: actions/checkout@v4
        with:
          ref: k8s-deployment

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci --omit=dev --ignore-scripts

      - name: Check laws and publish confirmed changes
        id: watch
        working-directory: server
        env:
          CLAUDE_PROXY_TOKEN: ${{ secrets.CLAUDE_PROXY_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: Compliance Check <no-reply@process.rit.services>
          LAW_WATCH_NOTIFY_EMAIL: compliance@rit.services
          CLIENT_URL: https://compliance.k8s.rit.services
          LAW_WATCH_BRANCH: k8s-deployment
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
        run: |
          git config user.name "Compliance Check law watch"
          git config user.email "action@github.com"
          before=$(git rev-parse HEAD)
          args="--local ../content --git-push"
          [ "$DRY_RUN" = "true" ] && args="$args --dry-run"
          [ -n "$ONLY" ] && args="$args --only $ONLY"
          node scripts/lawWatch.js $args
          [ "$(git rev-parse HEAD)" != "$before" ] && echo "published=true" >> "$GITHUB_OUTPUT" || true

      # A push made with GITHUB_TOKEN does not trigger other workflows, so start
      # the build-and-deploy workflow explicitly.
      - name: Deploy the published content
        if: steps.watch.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-k8s.yml --ref k8s-deployment --repo "${{ github.repository }}"
